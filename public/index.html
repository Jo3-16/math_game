<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathe-Missionen</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="spiel.js"></script>
</head>
<body>
  <main id="auswahl" hidden>
    <h1>Welche Welt?</h1>
    <div id="welten" class="raster"></div>
  </main>

  <main id="uebersicht" hidden>
    <header class="kopf">
      <h1 id="weltname"></h1>
      <div class="punkte"><button id="spielername" class="spielername" title="Namen ändern"></button> ⭐ <span id="gesamt-uebersicht">0</span> Punkte</div>
    </header>
    <nav class="links">
      <a href="/abzeichen">🏅 Abzeichen &amp; Punkte</a>
      <button id="galerie-knopf" class="link" hidden>🖼️ Bildergalerie</button>
    </nav>
    <div id="kapitel" class="raster"></div>
    <h2>Abzeichen</h2>
    <div id="abzeichen" class="abzeichen"></div>
  </main>

  <main id="ruhmeshalle" hidden>
    <header class="kopf">
      <h1>Abzeichen &amp; Punkte</h1>
      <div class="punkte"><span id="ruhm-name" class="spielername"></span> ⭐ <span id="ruhm-punkte">0</span> Punkte</div>
    </header>
    <p id="ruhm-zusammenfassung"></p>
    <div id="ruhm-abzeichen" class="abzeichen ruhm"></div>
    <p><a href="/">← Zurück zur Übersicht</a></p>
  </main>

  <main id="galerie" hidden>
    <header class="kopf">
      <h1>Bildergalerie</h1>
      <button id="galerie-zurueck" class="link">← Zurück zur Übersicht</button>
    </header>
    <p id="galerie-zusammenfassung"></p>
    <div id="galerie-inhalt"></div>
  </main>

  <main id="aufgabe" hidden>
    <div class="bildrahmen"><img id="bild" alt=""></div>
    <section class="text">
      <header class="kopf">
        <div>
          <div id="kapiteltitel" class="kapiteltitel"></div>
          <div id="fortschritt" class="fortschritt"></div>
        </div>
        <div class="punkte"><span id="spielername-aufgabe" class="spielername"></span> ⭐ <span id="gesamt-aufgabe">0</span></div>
      </header>
      <p id="geschichte" class="geschichte"></p>
      <p id="frage" class="frage"></p>
      <form id="antwort-form" autocomplete="off">
        <input id="antwort" inputmode="numeric" aria-label="Deine Antwort" placeholder="?">
        <button>Los!</button>
      </form>
      <p id="meldung" class="meldung" aria-live="polite"></p>
      <div id="admin-leiste" class="admin-leiste" hidden>
        <span id="admin-loesung"></span>
        <button id="admin-weiter">Weiter ▶</button>
      </div>
      <div id="tipp" class="tipp" hidden>
        <img id="helfer-bild" alt="">
        <p id="tipp-text"></p>
      </div>
      <button id="zurueck" class="link">← Zurück zur Übersicht</button>
    </section>
    <footer id="ergebnisse" class="ergebnisse" aria-label="Bisherige Ergebnisse" hidden></footer>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box">
      <div id="overlay-symbol" class="overlay-symbol"></div>
      <h2 id="overlay-titel"></h2>
      <p id="overlay-text"></p>
      <button id="overlay-weiter">Weiter</button>
    </div>
  </div>

  <p id="hinweis" class="hinweis" hidden></p>
</body>
</html>
